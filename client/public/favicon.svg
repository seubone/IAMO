<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#grad)"/>

  <!-- Monitor Screen -->
  <rect x="40" y="30" width="176" height="140" rx="8" fill="white" opacity="0.95"/>

  <!-- Screen Border -->
  <rect x="40" y="30" width="176" height="140" rx="8" fill="none" stroke="#1e40af" stroke-width="3"/>

  <!-- Monitor Stand -->
  <rect x="110" y="170" width="36" height="35" fill="#1e40af"/>
  <rect x="70" y="205" width="116" height="8" rx="4" fill="#1e40af"/>

  <!-- AI Indicators - Green Dots -->
  <circle cx="65" cy="60" r="8" fill="#10b981"/>
  <circle cx="100" cy="60" r="8" fill="#10b981"/>
  <circle cx="135" cy="60" r="8" fill="#10b981"/>

  <!-- Data Visualization Lines -->
  <polyline points="60,120 80,100 100,110 120,85 140,95 160,75 180,90"
            fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Monitoring Grid -->
  <line x1="60" y1="140" x2="196" y2="140" stroke="#e5e7eb" stroke-width="1" opacity="0.6"/>
  <line x1="60" y1="150" x2="196" y2="150" stroke="#e5e7eb" stroke-width="1" opacity="0.6"/>

  <!-- Status Indicator Pulse Circle -->
  <circle cx="180" cy="155" r="6" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="180" cy="155" r="4" fill="#10b981"/>
</svg>