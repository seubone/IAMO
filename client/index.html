<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Simonia</title>
    <meta name="description" content="Sistema completo de monitoramento de IAs integrado com WhatsApp e N8N. Gerencie instâncias, chats em tempo real, métricas de performance e muito mais." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Script de inicialização do tema ANTES do React carregar
      // Isso evita o "flash" de tema incorreto ao recarregar
      (function() {
        try {
          const saved = localStorage.getItem("theme");
          const theme = (saved === "light" || saved === "dark") ? saved : "light";
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          // Se localStorage não funcionar, deixar padrão
          document.documentElement.classList.add("light");
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
